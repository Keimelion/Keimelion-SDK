name: Release

# main only moves through release PRs (dev → main, merge commit): CI → semantic-release → npm publish.
# dev: CI → prerelease on the npm `dev` dist-tag. Same file as main because npm Trusted Publishing
# is bound to this workflow filename.

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  ci:
    uses: Keimelion/Keimelion-Infra/.github/workflows/node-ci.yml@main

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/release.yml@main
    secrets: inherit

  npm-publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/npm-publish.yml@main
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  publish-dev:
    needs: ci
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      id-token: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/npm-publish-dev.yml@main
