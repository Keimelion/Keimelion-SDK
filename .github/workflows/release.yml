name: Release

# main only moves through release PRs (dev → main, merge commit): CI → semantic-release → npm publish.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Keimelion/Keimelion-Infra/.github/workflows/node-ci.yml@main

  release:
    needs: ci
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/release.yml@main
    secrets: inherit

  npm-publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: Keimelion/Keimelion-Infra/.github/workflows/npm-publish.yml@main
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
